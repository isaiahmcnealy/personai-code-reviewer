[project]
name = "quorum"
version = "0.1.0"
description = "AI persona code reviewer for GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quorum = "quorum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]
