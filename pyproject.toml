[project]
name = "personai-code-reviewer"
version = "0.1.0"
description = "An open-source AI code reviewer for GitHub PRs with customizable reviewer personas."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaiah McNealy" }]
requires-python = ">=3.11"
keywords = ["code-review", "ai", "github", "pull-request", "claude", "llm"]
dependencies = [
    "anthropic>=0.116",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
personai = "personai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
